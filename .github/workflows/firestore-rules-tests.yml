name: Firestore Rules Tests

on:
  workflow_dispatch:
  push:
    branches: [main, feature/finance-department-comparison]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "tests/**"
      - "index.html"
      - "scripts/**"
      - ".github/workflows/firestore-rules-tests.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "tests/**"
      - "index.html"
      - "scripts/**"
      - ".github/workflows/firestore-rules-tests.yml"

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit details
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module -e 'import fs from "node:fs"; const report=JSON.parse(fs.readFileSync("npm-audit.json","utf8")); console.log("NPM AUDIT SUMMARY", JSON.stringify(report.metadata?.vulnerabilities || {})); for (const [name,item] of Object.entries(report.vulnerabilities || {})) console.log(JSON.stringify({name,severity:item.severity,isDirect:item.isDirect,range:item.range,fixAvailable:item.fixAvailable,via:(item.via || []).map(v=>typeof v==="string"?v:{name:v.name,title:v.title,url:v.url,range:v.range})}));'
      - name: Explain vulnerable dependency paths
        run: |
          npm explain tar || true
          npm explain @grpc/grpc-js || true
          npm explain @firebase/firestore || true
          npm audit --omit=dev || true
      - name: Check client JavaScript syntax
        run: npm run check:client
      - name: Run finance calculation unit tests
        run: npm run test:finance
      - name: Run Firestore rules tests
        run: npm run test:rules
