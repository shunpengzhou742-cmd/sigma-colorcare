<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>SIGMA ColorCare</title>
<style>
:root{color-scheme:dark;--glass:rgba(255,255,255,.105);--line:rgba(255,255,255,.2);--muted:#c7d2fe;--ink:#f8fafc;--cyan:#67e8f9;--blue:#60a5fa;--violet:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:#080d25}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 12% 12%,rgba(37,99,235,.55),transparent 36%),radial-gradient(ellipse at 88% 18%,rgba(124,58,237,.52),transparent 34%),radial-gradient(ellipse at 55% 100%,rgba(6,182,212,.30),transparent 42%),linear-gradient(135deg,#080d25 0%,#11163b 48%,#10102c 100%);background-attachment:fixed;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(55px);opacity:.55}
body:before{width:240px;height:240px;left:-90px;top:42%;background:#2563eb}
body:after{width:280px;height:280px;right:-110px;bottom:2%;background:#7c3aed}
header{max-width:1120px;margin:0 auto;padding:22px 22px 12px;display:flex;justify-content:space-between;align-items:center;gap:14px;background:transparent;color:white}
h1{font-size:19px;letter-spacing:.4px;margin:0;font-weight:800}header p{font-size:12px;color:#cbd5e1;margin:5px 0 0;letter-spacing:.5px}
main{width:min(100% - 28px,520px);margin:30px auto 0;padding:0 0 26px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.055));border:1px solid var(--line);border-radius:26px;padding:clamp(22px,5vw,34px);box-shadow:0 24px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%)}
#loginView{position:relative;overflow:hidden}#loginView:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#22d3ee,#60a5fa,#a78bfa);opacity:.95}
#loginView h2{font-size:clamp(25px,6vw,31px);letter-spacing:-.8px;margin:0 0 8px;font-weight:800}#loginView h2:after{content:"";display:block;width:54px;height:4px;border-radius:8px;margin-top:14px;background:linear-gradient(90deg,#22d3ee,#818cf8)}
#loginView:has(form):after{content:"SECURE WORKSPACE";display:block;font-size:9px;letter-spacing:2.4px;color:#a5b4fc;margin:0 0 24px}
label{display:block;color:#dbeafe;font-size:13px;font-weight:650;margin:14px 0 7px}
input{display:block;width:100%;padding:15px 16px;border:1px solid rgba(203,213,225,.24);border-radius:14px;margin:0 0 15px;background:rgba(8,15,40,.48);color:#fff;font-size:15px;outline:none;transition:border .2s,box-shadow .2s,background .2s}
input::placeholder{color:#94a3b8}input:focus{border-color:#67e8f9;box-shadow:0 0 0 3px rgba(34,211,238,.14);background:rgba(8,15,40,.7)}
button{border:1px solid transparent;border-radius:14px;padding:13px 16px;font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;min-height:46px}
button:active{transform:scale(.975);filter:brightness(1.12)}button:disabled{opacity:.55;cursor:wait;transform:none}
.primary{width:100%;color:white;background:linear-gradient(105deg,#2563eb 0%,#4f46e5 52%,#7c3aed 100%);box-shadow:0 10px 28px rgba(79,70,229,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.google-login{width:100%;margin-top:13px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);color:#f8fafc;display:flex;align-items:center;justify-content:center;gap:11px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.google-mark{width:19px;height:19px;border-radius:50%;background:#fff;color:#4285f4;font-size:14px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.divider{display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:11px;margin:18px 0 4px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:rgba(255,255,255,.17)}
#langBtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:white;padding:8px 12px;font-size:12px;min-height:36px;border-radius:11px}
.status{font-size:10px;padding:5px 9px;border-radius:20px;background:rgba(15,23,42,.65);color:#dbeafe;border:1px solid rgba(255,255,255,.16)}.statusrow{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.small{font-size:12px;margin-top:9px;color:#cbd5e1;line-height:1.6}#loginMsg{min-height:18px;line-height:1.6;overflow-wrap:anywhere;color:#cbd5e1}.invite-dept{display:inline-block;width:auto;margin:0 8px 0 0;vertical-align:middle}
.hidden{display:none!important}.warning{background:rgba(245,158,11,.14);color:#fde68a;border:1px solid rgba(251,191,36,.35);padding:12px;border-radius:12px;font-size:12px;margin:12px 0}
#appView{display:block}#appView>.card{display:flex;justify-content:space-between;align-items:center;gap:10px}#appView h3{font-size:17px;margin:26px 4px 12px;color:#e0e7ff}
#userEmail{overflow-wrap:anywhere;font-weight:700;margin-top:4px}.google-link{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#e0f2fe;margin-top:10px;font-size:11px;width:100%;padding:9px}
#logoutBtn,.dark{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:white}
.dept{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:18px;margin-top:12px;border:1px solid rgba(255,255,255,.23);border-radius:18px;color:#fff;background:linear-gradient(115deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 30px rgba(0,0,0,.16);min-height:76px}.dept .small{color:#cbd5e1}.dept b{font-size:22px;color:#a5f3fc}.repair{border-left:3px solid #60a5fa}.clean{border-left:3px solid #22d3ee}.weave{border-left:3px solid #a78bfa}
#deptView h2{margin-top:0}.dark{width:100%}footer{text-align:center;color:#94a3b8;font-size:11px;padding:18px 12px 28px}
.work-panel{margin:14px 0;padding:14px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(8,15,40,.28)}.work-panel h3{margin:4px 0 10px}.work-panel form label{display:block;margin:10px 0 5px;font-size:13px}.work-panel form input,.work-panel form select,.work-panel form textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#111827;font:inherit}.work-panel form button{width:100%;margin-top:14px}.work-record{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.16)}.work-record:last-child{border-bottom:0}.work-record strong{display:block}.work-summary-row{padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.16)}.work-summary-row:last-child{border-bottom:0}
.employee-card{margin-top:12px;padding:14px;border:1px solid rgba(255,255,255,.18);border-radius:16px;background:rgba(8,15,40,.34)}.employee-card strong{display:block;overflow-wrap:anywhere}.employee-card .small{margin:4px 0 10px}.employee-depts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.employee-depts label{display:flex;align-items:center;gap:5px;margin:0;padding:7px 9px;border:1px solid rgba(255,255,255,.15);border-radius:10px;font-size:12px}.employee-depts input{width:auto;margin:0}.employee-actions{display:flex;gap:8px;flex-wrap:wrap}.employee-actions button{flex:1;min-width:120px}.employee-status{font-size:11px;color:#a5f3fc;margin:4px 0 8px}
@media(min-width:700px){main{margin-top:55px}#loginView{padding:38px}.card{border-radius:28px}}
@media(max-width:420px){header{padding:17px 15px 8px}main{width:calc(100% - 24px);margin-top:22px}.status{font-size:9px;padding:4px 7px}h1{font-size:17px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

/* SIGMA ColorCare UI refresh v7 — clean blue factory workspace */
:root{color-scheme:light;--brand:#1557a6;--brand-deep:#123f79;--accent:#2478df;--ink:#172b45;--muted:#6b7f98;--line:#dce6f2;--surface:#fff;--soft:#f3f7fc}
html,body{background:#f2f6fb!important;color:var(--ink)!important}
body{font-family:Inter,"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#eaf2fc 0,#f5f8fc 230px,#f4f7fb 100%)!important;background-attachment:scroll!important}
body:before,body:after{display:none}
header{max-width:1180px;margin:0 auto;padding:17px 22px 15px;background:linear-gradient(115deg,#164f94,#2168b6);color:#fff;border-radius:0 0 22px 22px;box-shadow:0 8px 24px rgba(21,67,120,.18)}
header>div:first-child{display:flex;align-items:center;gap:12px}
header>div:first-child:before{content:"Σ";display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#ffcf42,#f08b25);color:#123f79;font-size:27px;font-weight:900;box-shadow:0 3px 10px #0c376455}
h1{font-size:20px;letter-spacing:.2px}header p{color:#dbeafe;font-size:12px}
main{width:min(100% - 32px,1120px);margin:24px auto 0;padding-bottom:36px}
.card{background:#fff!important;border:1px solid #e1e9f3!important;border-radius:18px!important;padding:22px!important;box-shadow:0 5px 20px rgba(27,62,102,.07)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;color:var(--ink)!important}
#appView>.card:first-child{border-top:3px solid #2478df!important}
#loginView{max-width:480px;margin:38px auto}
#loginView:before{background:#2478df}
#loginView h2{color:#173f70}
#loginView h2:after{background:#2478df}
#loginView:has(form):after{color:#7890aa}
label{color:#415a77}
input{background:#f8fafd!important;border:1px solid #d5e0ed!important;color:#172b45!important;border-radius:11px!important}
input::placeholder{color:#91a0b3}
input:focus{border-color:#4388df!important;box-shadow:0 0 0 3px #2478df1c!important;background:#fff!important}
button{border-radius:11px}
.primary{background:linear-gradient(105deg,#1766c2,#267fe0)!important;box-shadow:0 5px 13px #1766c226!important}
.google-login{background:#fff!important;border:1px solid #d7e1ed!important;color:#24415f!important}
.google-mark{border:1px solid #e3e9f0}
#langBtn{background:#ffffff20;border:1px solid #ffffff55;color:#fff}
.status{background:#ffffff1c;border-color:#ffffff40;color:#eff6ff}
.statusrow{margin-bottom:7px}
#userEmail{color:#163f70;font-size:15px}
#logoutBtn,.dark{background:#edf3fa!important;border:1px solid #d7e2ef!important;color:#315577!important}
.google-link{background:#f2f7fd!important;border:1px solid #d8e5f3!important;color:#2864a5!important}
#appView h3{color:#1d4f85;margin:22px 2px 12px;font-size:17px}
#appView>.dept{width:calc((100% - 24px)/3);min-height:132px;display:inline-flex;vertical-align:top;margin:10px 8px 0 0;padding:18px;background:#fff!important;border:1px solid #dfe8f3!important;border-left:4px solid #2b75c9!important;border-radius:16px!important;box-shadow:0 5px 16px #1e4e8010!important;color:#173f70!important;backdrop-filter:none!important}
#appView>.dept:nth-of-type(3n){margin-right:0}
#appView>.dept strong{font-size:16px}
#appView>.dept .small{color:#71849b!important}
#appView>.dept b{color:#2878cf;font-size:25px}
#deptRepair{border-left-color:#2776d2!important}#deptClean{border-left-color:#18a6b5!important}#deptWeave{border-left-color:#8265c7!important}
#deptView{max-width:900px;margin:0 auto}
#deptView h2{color:#174b83}
.work-panel{margin:14px 0!important;padding:18px!important;border:1px solid #e1e9f3!important;border-radius:15px!important;background:#f9fbfe!important}
.work-panel h3{color:#1c568f!important;margin:2px 0 12px!important}
.work-panel .small{color:#687f99}
.work-panel form input,.work-panel form select,.work-panel form textarea{background:#fff!important;border:1px solid #d5e0ed!important;color:#1d3551!important;border-radius:10px!important;padding:12px!important}
.work-panel form label{color:#49627d}
.work-record{border-bottom:1px solid #e6edf5}
.work-summary-row{border-bottom:1px dashed #dce6f1}
.employee-card{background:#f8fbff!important;border:1px solid #e0e9f4!important;border-radius:13px!important;color:#213c5b}
.employee-card .small{color:#6d8097}
.employee-depts label{color:#3c5877;border-color:#dce6f1}
footer{color:#8394a9;padding:22px}
.warning{background:#fff8e8;color:#8a5a00;border-color:#f4d99b}
@media(max-width:720px){
 header{border-radius:0 0 17px 17px;padding:14px 15px}
 header>div:first-child:before{width:39px;height:39px;font-size:23px}
 h1{font-size:18px}
 main{width:calc(100% - 24px);margin-top:16px}
 .card{padding:17px!important;border-radius:15px!important}
 #appView>.dept{width:100%;min-height:78px;display:flex;margin:9px 0 0;padding:15px}
 #appView>.dept:nth-of-type(3n){margin-right:0}
 #appView>.dept b{font-size:22px}
 #appView>.card:first-child{align-items:flex-start!important}
 #logoutBtn{white-space:nowrap;padding:10px 12px}
}
@media(min-width:721px){#appView{display:block}#invitePanel,#employeeManagePanel{max-width:100%}}


/* SIGMA ColorCare v8 theme system — vivid brand gradients + day/night */
:root{--sigma-blue:#175da9;--sigma-cyan:#19a9c5;--sigma-purple:#7863c9;--sigma-gold:#f2b94b}
body:not(.theme-dark){background:
 radial-gradient(ellipse at 8% 18%,rgba(50,133,218,.17),transparent 32%),
 radial-gradient(ellipse at 92% 22%,rgba(35,183,190,.16),transparent 30%),
 radial-gradient(ellipse at 80% 88%,rgba(142,111,208,.13),transparent 34%),
 linear-gradient(145deg,#edf5ff 0%,#f7f8fd 48%,#eef9f8 100%)!important}
body:not(.theme-dark) main:before{content:"";position:fixed;z-index:-1;pointer-events:none;width:340px;height:340px;left:-190px;top:48%;border-radius:50%;background:linear-gradient(135deg,#4b9be8,#66d0d0);filter:blur(65px);opacity:.18}
#themeToggle{background:#ffffff20;border:1px solid #ffffff55;color:#fff;padding:8px 11px;font-size:12px;min-height:36px;border-radius:11px;white-space:nowrap}
header>div:last-child{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
body.theme-dark{color:#e7f0ff!important;background:
 radial-gradient(ellipse at 12% 15%,rgba(28,102,180,.34),transparent 34%),
 radial-gradient(ellipse at 88% 20%,rgba(112,75,174,.32),transparent 32%),
 radial-gradient(ellipse at 70% 95%,rgba(14,145,155,.22),transparent 38%),
 linear-gradient(145deg,#0a1730 0%,#111d3a 52%,#15162f 100%)!important}
body.theme-dark header{background:linear-gradient(115deg,#102f59,#174f87);box-shadow:0 8px 28px #020b1e66}
body.theme-dark .card{background:linear-gradient(145deg,rgba(32,54,86,.96),rgba(23,38,66,.96))!important;border-color:#365174!important;color:#e7f0ff!important;box-shadow:0 10px 28px #020b1e55!important}
body.theme-dark #loginView h2,body.theme-dark #appView h3,body.theme-dark #deptView h2{color:#dcecff}
body.theme-dark label{color:#c4d7ef}
body.theme-dark input{background:#101e36!important;border-color:#3b5475!important;color:#f4f8ff!important}
body.theme-dark input::placeholder{color:#8fa5c1}
body.theme-dark input:focus{background:#142642!important;border-color:#58a9ed!important;box-shadow:0 0 0 3px #328bd32a!important}
body.theme-dark .google-login{background:#1d3454!important;border-color:#496486!important;color:#edf5ff!important}
body.theme-dark #logoutBtn,body.theme-dark .dark{background:#263e60!important;border-color:#456184!important;color:#e5efff!important}
body.theme-dark .google-link{background:#1b3659!important;border-color:#45668b!important;color:#a9d4ff!important}
body.theme-dark #appView>.dept{background:linear-gradient(120deg,#203c60,#1a2e4d)!important;border-color:#385879!important;color:#edf5ff!important;box-shadow:0 8px 22px #020b1e44!important}
body.theme-dark #appView>.dept .small{color:#b4c8e0!important}
body.theme-dark #appView>.dept b{color:#8bd7f3}
body.theme-dark .work-panel{background:linear-gradient(145deg,#1a2e4c,#172741)!important;border-color:#385273!important;color:#e5efff}
body.theme-dark .work-panel h3{color:#b9dcff!important}
body.theme-dark .work-panel .small,body.theme-dark .employee-card .small{color:#b2c5dc}
body.theme-dark .work-panel form input,body.theme-dark .work-panel form select,body.theme-dark .work-panel form textarea{background:#102039!important;border-color:#3c5879!important;color:#f2f7ff!important}
body.theme-dark .work-record,body.theme-dark .work-summary-row{border-color:#38506d}
body.theme-dark .employee-card{background:#1a2e4b!important;border-color:#3b5576!important;color:#e7f0ff}
body.theme-dark .employee-depts label{color:#d2e4f8;border-color:#425d7d}
body.theme-dark footer{color:#91a8c4}
body.theme-dark .warning{background:#4a371b;color:#ffe4a3;border-color:#8b692e}
body.theme-dark #loginView:has(form):after{color:#9fc8f3}
@media(max-width:420px){#themeToggle{font-size:11px;padding:7px 9px}}

</style>

<body>
<header>
  <div><h1>SIGMA ColorCare</h1><p data-i18n="subtitle">智能工厂管理系统</p></div>
  <div style="text-align:right">
    <div class="statusrow"><span id="netStatus" class="status">检查网络</span><span id="fbStatus" class="status">连接中</span></div>
    <button id="langBtn" type="button" onclick="switchLang()">Tiếng Việt</button>
    <button id="themeToggle" type="button" aria-pressed="false" onclick="toggleSigmaTheme()">🌙 夜间模式 / Chế độ tối</button>
  </div>
</header>

<main>
  <section id="loginView" class="card">
    <h2 data-i18n="login">登录系统</h2>
    <div id="configWarning" class="warning hidden" data-i18n="configWarning">Firebase 尚未配置。</div>
    <form id="loginForm">
      <label for="email" data-i18n="email">账号 / 邮箱</label>
      <input type="email" id="email" placeholder="name@example.com" autocomplete="username" required>
      <label for="password" data-i18n="password">密码</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button id="loginBtn" class="primary" type="submit" data-i18n="loginBtn">登录</button>
    </form>
    <div class="divider" data-i18n="orContinue">或使用其他方式</div>
    <button id="googleLoginBtn" class="google-login" type="button"><span class="google-mark">G</span><span data-i18n="googleLogin">使用 Google 账号登录</span></button>
    <p id="loginMsg" class="small" role="status" aria-live="polite"></p>
  </section>

  <section id="appView" class="hidden">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="flex:1;min-width:0"><small data-i18n="user">当前用户</small><div id="userEmail"></div>
        <button id="googleLinkBtn" class="google-link" type="button" data-i18n="googleLink">绑定 Google 登录</button>
      </div>
      <button id="logoutBtn" type="button" onclick="logout()" data-i18n="logout">退出登录</button>
    </div>
    <section id="invitePanel" class="card hidden" style="margin-top:18px">
      <h3 data-i18n="inviteTitle">员工邀请</h3>
      <p class="small" data-i18n="inviteDesc">生成24小时有效、只能使用一次的员工邀请。</p>
      <label><input class="invite-dept" type="checkbox" value="1"> <span data-i18n="repair">修色部门</span></label>
      <label><input class="invite-dept" type="checkbox" value="2"> <span data-i18n="clean">清洗部门</span></label>
      <label><input class="invite-dept" type="checkbox" value="3"> <span data-i18n="weave">修织部门</span></label>
      <button id="createInviteBtn" class="primary" type="button" data-i18n="createInvite">生成员工邀请二维码</button>
      <div id="inviteResult" class="hidden" style="margin-top:16px;text-align:center">
        <div id="inviteQr" style="display:inline-block;background:white;padding:12px;border-radius:12px"></div>
        <p id="inviteLinkText" class="small" style="overflow-wrap:anywhere"></p>
        <button id="copyInviteBtn" class="dark" type="button" data-i18n="copyInvite">复制邀请链接</button>
      </div>
      <p id="inviteMsg" class="small" role="status" aria-live="polite"></p>
    </section>
    <section id="employeeManagePanel" class="card hidden" style="margin-top:18px">
      <h3 data-i18n="employeeManageTitle">员工管理</h3>
      <p class="small" data-i18n="employeeManageDesc">查看员工资料、调整部门权限或停用系统访问。</p>
      <button id="refreshEmployeesBtn" class="dark" type="button" data-i18n="refreshEmployees">刷新员工名单</button>
      <p id="employeeManageMsg" class="small" role="status" aria-live="polite"></p>
      <div id="employeeList"></div>
    </section>
    <h3 data-i18n="selectDept">请选择部门</h3>
    <button id="deptRepair" class="dept repair" type="button" onclick="openDept('repair')">
      <span><strong data-i18n="repair">修色部门</strong><div class="small" data-i18n="repairDesc">喷色 / 手工描绘</div></span><b>→</b>

function updateGoogleLinkButton(user){
  const button = document.getElementById("googleLinkBtn");
  if(!button) return;
  const linked = !!user?.providerData?.some(item => item.providerId === "google.com");
  button.textContent = linked ? tr("googleLinked") : tr("googleLink");
  button.disabled = linked;
}
function mapAuthError(error){
  const code = error?.code || "";
  if(code.includes("credential-already-in-use") || code.includes("email-already-in-use")) return tr("googleCredentialInUse");
  if(code.includes("invalid-credential") || code.includes("wrong-password")) return tr("wrongPassword");
  if(code.includes("user-not-found")) return tr("userNotFound");
  if(code.includes("invalid-email")) return tr("invalidEmail");
  if(code.includes("too-many-requests")) return tr("tooMany");
  if(code.includes("network-request-failed")) return tr("networkError");
  if(code.includes("permission-denied")) return tr("permission");
  return tr("generic") + (code ? " (" + code + ")" : "");
}

function identityErrorMessage(error){
  if(error.message === "INVITE_INVALID" || error.message === "INVITE_ALREADY_USED") return tr("inviteInvalid");
  if(error.message === "INVITE_GOOGLE_REQUIRED") return tr("inviteGoogleOnly");
  if(error.message === "INVITE_ADMIN_NOT_ALLOWED") return tr("inviteAdminDenied");
  if(error.message === "ADMIN_PROFILE_MISSING") return tr("noAdmin");
  if(error.message === "ADMIN_ROLE_INVALID") return tr("notAdmin");
  if(error.message === "ADMIN_INACTIVE") return tr("inactive");
  if(error.message === "EMPLOYEE_PROFILE_MISSING") return tr("noEmployee");
  if(error.message === "EMPLOYEE_INACTIVE") return tr("employeeInactive");
  if(error.message === "EMPLOYEE_PROFILE_INVALID") return tr("employeeInvalid");
  return mapAuthError(error);
}

async function completeEmployeeInvite(user){
  const inviteId = new URLSearchParams(window.location.search).get("invite");
  if(!inviteId) return false;
  if(inviteCompletionPromise) return inviteCompletionPromise;
  inviteCompletionPromise = (async () => {
    if(!user.providerData?.some(provider => provider.providerId === "google.com")) throw new Error("INVITE_GOOGLE_REQUIRED");
    const adminSnap = await getDoc(doc(db,"admins",user.uid));
    if(adminSnap.exists()) return false;
    const inviteRef = doc(db, "employeeInvites", inviteId);
    const employeeRef = doc(db, "employees", user.uid);
    const existingEmployee = await getDoc(employeeRef);
    if(existingEmployee.exists()) return false;
    let employeeAlreadyExists = false;
    await runTransaction(db, async transaction => {
      const inviteSnap = await transaction.get(inviteRef);
      const employeeSnap = await transaction.get(employeeRef);
      if(employeeSnap.exists()){
        employeeAlreadyExists = true;
        return;
      }
      if(!inviteSnap.exists()) throw new Error("INVITE_INVALID");
      const invite = inviteSnap.data();
      if(invite.status !== "active" || !invite.expiresAt || invite.expiresAt.toMillis() <= Date.now()) throw new Error("INVITE_INVALID");
      if(!Array.isArray(invite.departmentIds) || invite.departmentIds.length === 0) throw new Error("INVITE_INVALID");
      const employee = {
        uid:user.uid,
        name:user.displayName || (user.email ? user.email.split("@")[0] : "Employee"),
        email:user.email || "",
        roleType:1,
        status:"active",
        departmentIds:invite.departmentIds,
        repairTypeIds:invite.repairTypeIds || [],
        specialRole:false,
        invitationId:inviteId,
        createdAt:serverTimestamp(),
        createdBy:invite.createdBy,
        updatedAt:serverTimestamp()
      };
      transaction.update(inviteRef,{status:"used",usedBy:user.uid,usedAt:serverTimestamp()});
      transaction.set(employeeRef,employee);
    });
    const cleanUrl = new URL(window.location.href);
    cleanUrl.searchParams.delete("invite");
    window.history.replaceState({}, "", cleanUrl.toString());
    if(employeeAlreadyExists) return false;
    inviteCompletedUid = user.uid;
    return true;
  })();
  try { return await inviteCompletionPromise; }
  finally { inviteCompletionPromise = null; }
}

async function createEmployeeInvite(){
  const selected = [...document.querySelectorAll(".invite-dept:checked")].map(el => Number(el.value));
  const msg = document.getElementById("inviteMsg");
  if(!selected.length){ msg.textContent = tr("inviteSelect"); return; }
  const button = document.getElementById("createInviteBtn");
  button.disabled = true;
  msg.textContent = tr("inviteCreating");
  try{
    const bytes = new Uint8Array(32);
    crypto.getRandomValues(bytes);
    const inviteId = [...bytes].map(value => value.toString(16).padStart(2,"0")).join("");
    const inviteRef = doc(db,"employeeInvites",inviteId);
    const repairTypeIds = selected.includes(1) ? [101,102] : [];
    await setDoc(inviteRef,{
      departmentIds:selected,
      repairTypeIds,
      status:"active",
      expiresAt:Timestamp.fromDate(new Date(Date.now()+24*60*60*1000)),
      createdAt:serverTimestamp(),
      createdBy:auth.currentUser.uid,
      usedBy:null,
      usedAt:null
    });
    const inviteUrl = new URL(window.location.href);
    inviteUrl.searchParams.set("invite",inviteId);
    latestInviteUrl = inviteUrl.toString();
    document.getElementById("inviteQr").innerHTML = "";
    if(window.QRCode){
      new window.QRCode(document.getElementById("inviteQr"),{text:latestInviteUrl,width:220,height:220,colorDark:"#111827",colorLight:"#ffffff",correctLevel:window.QRCode.CorrectLevel.M});
    }else{
      document.getElementById("inviteQr").textContent = "QR unavailable";
    }
    document.getElementById("inviteLinkText").textContent = latestInviteUrl;
    document.getElementById("inviteResult").classList.remove("hidden");
    msg.textContent = tr("inviteReady");
  }catch(error){
    console.error("SIGMA employee invitation error:",error);
    msg.textContent = tr("inviteError") + (error.code || error.message || "unknown");
  }finally{ button.disabled = false; }
}

function setEmployeeManageMessage(message, isError=false){
  const el = document.getElementById("employeeManageMsg");

async function loadEmployees(){
  if(currentRole !== "admin") return;
  setEmployeeManageMessage(tr("loadingEmployees"));
  const button = document.getElementById("refreshEmployeesBtn");
  button.disabled = true;
  try{
    const snapshot = await getDocs(collection(db,"employees"));
    employeeCache = snapshot.docs.map(item => ({id:item.id,...item.data()}))
      .sort((a,b)=>(a.name || a.email || a.uid || "").localeCompare(b.name || b.email || b.uid || ""));
    renderEmployeeList(employeeCache);
    setEmployeeManageMessage(employeeCache.length ? "" : tr("noEmployees"));
  }catch(error){
    console.error("SIGMA employee directory error:",error);
    setEmployeeManageMessage(tr("employeeLoadError") + (error.code || error.message || "unknown"),true);
  }finally{ button.disabled = false; }
}

function renderEmployeeList(employees){
  const root = document.getElementById("employeeList");
  if(!root) return;
  root.replaceChildren();
  if(!employees.length) return;
  const deptNames = {1:tr("repair"),2:tr("clean"),3:tr("weave")};
  for(const employee of employees){
    const card = document.createElement("article");
    card.className = "employee-card";
    const name = document.createElement("strong");
    name.textContent = employee.name || employee.email || employee.uid;
    const email = document.createElement("div");
    email.className = "small";
    email.textContent = employee.email || employee.uid;
    const status = document.createElement("div");
    status.className = "employee-status";
    status.textContent = employee.status === "disabled" ? tr("statusDisabled") : tr("statusActive");
    const deptWrap = document.createElement("div");
    deptWrap.className = "employee-depts";
    for(const id of [1,2,3]){
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "employee-dept-check";
      checkbox.value = String(id);
      checkbox.checked = Array.isArray(employee.departmentIds) && employee.departmentIds.includes(id);
      label.append(checkbox,document.createTextNode(deptNames[id]));
      deptWrap.append(label);
    }
    const actions = document.createElement("div");
    actions.className = "employee-actions";
    const save = document.createElement("button");
    save.type = "button";
    save.className = "primary";
    save.textContent = tr("saveAccess");
    save.addEventListener("click",async()=>{
      const selected = [...deptWrap.querySelectorAll("input:checked")].map(el=>Number(el.value));
      if(!selected.length){ setEmployeeManageMessage(tr("inviteSelect"),true); return; }
      save.disabled = true;
      save.textContent = tr("savingAccess");
      try{
        await updateDoc(doc(db,"employees",employee.id),{
          departmentIds:selected,
          repairTypeIds:selected.includes(1) ? [101,102] : [],
          updatedAt:serverTimestamp()
        });
        setEmployeeManageMessage(tr("accessSaved"));
        await loadEmployees();
      }catch(error){
        console.error("SIGMA employee access update error:",error);
        setEmployeeManageMessage(tr("employeeSaveError")+(error.code || error.message || "unknown"),true);
      }finally{ save.disabled = false; save.textContent = tr("saveAccess"); }
    });
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "dark";
    const nextStatus = employee.status === "disabled" ? "active" : "disabled";
    toggle.textContent = nextStatus === "disabled" ? tr("disableEmployee") : tr("enableEmployee");
    toggle.addEventListener("click",async()=>{
      toggle.disabled = true;
      try{
        await updateDoc(doc(db,"employees",employee.id),{
          status:nextStatus,
          updatedAt:serverTimestamp()
        });
        setEmployeeManageMessage(nextStatus === "disabled" ? tr("employeeDisabled") : tr("employeeEnabled"));
        await loadEmployees();
      }catch(error){
        console.error("SIGMA employee status update error:",error);
        setEmployeeManageMessage(tr("employeeSaveError")+(error.code || error.message || "unknown"),true);
      }finally{ toggle.disabled = false; }
    });
    actions.append(save,toggle);
    card.append(name,email,status,deptWrap,actions);
    root.append(card);
  }
}

document.getElementById("refreshEmployeesBtn").addEventListener("click",loadEmployees);

function localWorkDate(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh"}).format(new Date());
}
function setRepairWorkMessage(message,isError=false){
  const el=document.getElementById("repairWorkMessage");
  if(!el) return;

  el.style.color=isError?"#fecaca":"#bbf7d0";
}
function renderRepairWorkOrders(rows){
  const list=document.getElementById("repairWorkOrderList");
  const summary=document.getElementById("repairDailySummary");
  list.replaceChildren();
  summary.replaceChildren();
  if(!rows.length){
    list.textContent=tr("noRepairOrders");
    summary.textContent=tr("noRepairOrders");
    return;
  }
  const typeNames={101:tr("sprayRepair"),102:tr("handRepair")};
  const totals=new Map();
  for(const row of rows){
    const key=row.workDate+"|"+row.repairTypeId;
    const value=totals.get(key)||{date:row.workDate,type:row.repairTypeId,quantity:0,batches:0};
    value.quantity+=row.quantity;
    value.batches+=1;
    totals.set(key,value);
  }
  [...totals.values()].sort((a,b)=>b.date.localeCompare(a.date)||a.type-b.type).forEach(item=>{
    const line=document.createElement("div");
    line.className="work-summary-row";
    line.textContent=item.date+" · "+typeNames[item.type]+" · "+item.quantity+" · "+item.batches;
    summary.append(line);
  });
  rows.sort((a,b)=>(b.workDate||"").localeCompare(a.workDate||"")||(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  rows.slice(0,50).forEach(row=>{
    const item=document.createElement("article");
    item.className="work-record";
    const heading=document.createElement("strong");
    heading.textContent=(row.workDate||"")+" · "+(typeNames[row.repairTypeId]||String(row.repairTypeId))+" · "+row.quantity;
    const details=document.createElement("div");
    details.className="small";
    const parts=[row.orderNo,row.styleNo,row.color].filter(Boolean);
    details.textContent=parts.join(" / ")+(currentRole==="admin"?" · UID "+row.employeeUid:"");
    const note=document.createElement("div");
    note.className="small";
    note.textContent=row.note||"";
    item.append(heading,details,note);
    list.append(item);
  });
}
async function loadRepairWorkOrders(){
  if(!currentRole||!currentDept||currentDept!=="repair") return;
  const button=document.getElementById("refreshRepairOrders");
  if(button) button.disabled=true;
  try{
    const base=collection(db,"repairWorkOrders");
    const q=currentRole==="admin"
      ? query(base,limit(100))
      : query(base,where("employeeUid","==",auth.currentUser.uid),where("departmentId","==",1),limit(100));
    const snapshot=await getDocs(q);
    renderRepairWorkOrders(snapshot.docs.map(item=>({id:item.id,...item.data()})));
  }catch(error){
    console.error("SIGMA repair work order read error:",error);
    document.getElementById("repairWorkOrderList").textContent=tr("workOrderError")+(error.code||error.message||"unknown");
  }finally{if(button) button.disabled=false;}
}
document.getElementById("repairWorkOrderForm").addEventListener("submit",async event=>{
  event.preventDefault();
  if(currentRole!=="employee"||!currentProfile?.departmentIds?.includes(1)||!auth.currentUser) return;
  const typeId=Number(document.getElementById("repairTypeId").value);
  if(!currentProfile.repairTypeIds?.includes(typeId)){setRepairWorkMessage(tr("employeeInvalid"),true);return;}
  const quantity=Number(document.getElementById("repairQuantity").value);
  if(!Number.isSafeInteger(quantity)||quantity<1||quantity>1000000){setRepairWorkMessage(tr("workOrderError"),true);return;}
  const button=document.getElementById("submitRepairOrder");
  button.disabled=true;
  button.textContent=tr("submittingWorkOrder");
  setRepairWorkMessage("");

    await addDoc(collection(db,"repairWorkOrders"),{
      employeeUid:auth.currentUser.uid,
      createdBy:auth.currentUser.uid,
      departmentId:1,
      repairTypeId:typeId,
      workDate:document.getElementById("repairWorkDate").value,
      orderNo:document.getElementById("repairOrderNo").value.trim(),
      styleNo:document.getElementById("repairStyleNo").value.trim(),
      color:document.getElementById("repairColor").value.trim(),
      quantity,
      note:document.getElementById("repairNote").value.trim(),
      status:"submitted",
      createdAt:serverTimestamp()
    });
    document.getElementById("repairOrderNo").value="";
    document.getElementById("repairStyleNo").value="";
    document.getElementById("repairColor").value="";
    document.getElementById("repairQuantity").value="";
    document.getElementById("repairNote").value="";
    setRepairWorkMessage(tr("workOrderSaved"));
    await loadRepairWorkOrders();
  }catch(error){
    console.error("SIGMA repair work order submit error:",error);
    setRepairWorkMessage(tr("workOrderError")+(error.code||error.message||"unknown"),true);
  }finally{button.disabled=false;button.textContent=tr("submitWorkOrder");}
});
document.getElementById("refreshRepairOrders").addEventListener("click",loadRepairWorkOrders);

async function resolveUserRole(user){
  const adminSnap = await getDoc(doc(db, "admins", user.uid));
  if(adminSnap.exists()){
    const admin = adminSnap.data();
    if(admin.role !== "admin") throw new Error("ADMIN_ROLE_INVALID");
    if(admin.status !== "active") throw new Error("ADMIN_INACTIVE");
    return {role:"admin", profile:admin, departmentIds:[1,2,3]};
  }
  const employeeSnap = await getDoc(doc(db, "employees", user.uid));
  if(!employeeSnap.exists()) throw new Error("EMPLOYEE_PROFILE_MISSING");
  const employee = employeeSnap.data();
  if(employee.status !== "active") throw new Error("EMPLOYEE_INACTIVE");
  if(employee.roleType !== 1 || !Array.isArray(employee.departmentIds) || employee.departmentIds.length === 0 || employee.departmentIds.some(id => ![1,2,3].includes(id))) throw new Error("EMPLOYEE_PROFILE_INVALID");
  return {role:"employee", profile:employee, departmentIds:[...new Set(employee.departmentIds)]};
}

  if(!result?.user) return;
  try{

    if(joined) setMessage(tr("inviteDone"));
    const identity = await resolveUserRole(result.user);
    showApp(result.user, identity);
    setMessage(joined || inviteCompletedUid === result.user.uid ? tr("inviteDone") : (result.operationType === "signIn" ? tr("googleLoginSuccess") : tr("googleLinkSuccess")));
  }catch(error){
    console.error("SIGMA ColorCare post-link admin check error:", error);
    setMessage(identityErrorMessage(error), true);
    try{ await signOut(auth); }catch(signOutError){ console.error(signOutError); }
    showLogin();
  }
}).catch(error => {
  console.error("SIGMA ColorCare Google redirect error:", error);
  setMessage(tr("googleLinkError") + mapAuthError(error), true);

  if(googleButton) googleButton.disabled = false;

document.getElementById("loginForm").addEventListener("submit", async event => {

  const button = document.getElementById("loginBtn");
  button.disabled = true;
  setMessage(tr("signingIn"));
  try{
    const credential = await signInWithEmailAndPassword(auth, email, password);
    setMessage(tr("checkingAdmin"));
    const joined = await completeEmployeeInvite(credential.user);
    if(joined) setMessage(tr("inviteDone"));
    const identity = await resolveUserRole(credential.user);
    showApp(credential.user, identity);
    setMessage("");
  }catch(error){
    console.error("SIGMA ColorCare login error:", error);
    const identityMessage = identityErrorMessage(error);
    setMessage(identityMessage === mapAuthError(error) ? tr("loginFailed") + identityMessage : identityMessage, true);
    if(auth.currentUser){
      try{ await signOut(auth); }catch(signOutError){ console.error(signOutError); }

    showLogin();
  }finally{
    button.disabled = false;
  }
});

onAuthStateChanged(auth, async user => {
  if(handlingAuthState) return;
  handlingAuthState = true;
  try{
    if(!user){
      showLogin();
      return;
    }
    const joined = await completeEmployeeInvite(user);
    const identity = await resolveUserRole(user);
    showApp(user, identity);
    if(joined || inviteCompletedUid === user.uid) setMessage(tr("inviteDone"));
  }catch(error){
    console.error("SIGMA ColorCare admin check error:", error);
    try{ await signOut(auth); }catch(signOutError){ console.error(signOutError); }
    showLogin();
    setMessage(identityErrorMessage(error), true);
  }finally{
    handlingAuthState = false;
  }
});
