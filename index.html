<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>SIGMA ColorCare</title>
<style>
:root{color-scheme:dark;--glass:rgba(255,255,255,.105);--line:rgba(255,255,255,.2);--muted:#c7d2fe;--ink:#f8fafc;--cyan:#67e8f9;--blue:#60a5fa;--violet:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:#080d25}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 12% 12%,rgba(37,99,235,.55),transparent 36%),radial-gradient(ellipse at 88% 18%,rgba(124,58,237,.52),transparent 34%),radial-gradient(ellipse at 55% 100%,rgba(6,182,212,.30),transparent 42%),linear-gradient(135deg,#080d25 0%,#11163b 48%,#10102c 100%);background-attachment:fixed;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(55px);opacity:.55}
body:before{width:240px;height:240px;left:-90px;top:42%;background:#2563eb}
body:after{width:280px;height:280px;right:-110px;bottom:2%;background:#7c3aed}
header{max-width:1120px;margin:0 auto;padding:22px 22px 12px;display:flex;justify-content:space-between;align-items:center;gap:14px;background:transparent;color:white}
h1{font-size:19px;letter-spacing:.4px;margin:0;font-weight:800}header p{font-size:12px;color:#cbd5e1;margin:5px 0 0;letter-spacing:.5px}
main{width:min(100% - 28px,520px);margin:30px auto 0;padding:0 0 26px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.055));border:1px solid var(--line);border-radius:26px;padding:clamp(22px,5vw,34px);box-shadow:0 24px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%)}
#loginView{position:relative;overflow:hidden}#loginView:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#22d3ee,#60a5fa,#a78bfa);opacity:.95}
#loginView h2{font-size:clamp(25px,6vw,31px);letter-spacing:-.8px;margin:0 0 8px;font-weight:800}#loginView h2:after{content:"";display:block;width:54px;height:4px;border-radius:8px;margin-top:14px;background:linear-gradient(90deg,#22d3ee,#818cf8)}
#loginView:has(form):after{content:"SECURE WORKSPACE";display:block;font-size:9px;letter-spacing:2.4px;color:#a5b4fc;margin:0 0 24px}
label{display:block;color:#dbeafe;font-size:13px;font-weight:650;margin:14px 0 7px}
input{display:block;width:100%;padding:15px 16px;border:1px solid rgba(203,213,225,.24);border-radius:14px;margin:0 0 15px;background:rgba(8,15,40,.48);color:#fff;font-size:15px;outline:none;transition:border .2s,box-shadow .2s,background .2s}
input::placeholder{color:#94a3b8}input:focus{border-color:#67e8f9;box-shadow:0 0 0 3px rgba(34,211,238,.14);background:rgba(8,15,40,.7)}
button{border:1px solid transparent;border-radius:14px;padding:13px 16px;font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;min-height:46px}
button:active{transform:scale(.975);filter:brightness(1.12)}button:disabled{opacity:.55;cursor:wait;transform:none}
.primary{width:100%;color:white;background:linear-gradient(105deg,#2563eb 0%,#4f46e5 52%,#7c3aed 100%);box-shadow:0 10px 28px rgba(79,70,229,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.google-login{width:100%;margin-top:13px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);color:#f8fafc;display:flex;align-items:center;justify-content:center;gap:11px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.google-mark{width:19px;height:19px;border-radius:50%;background:#fff;color:#4285f4;font-size:14px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.divider{display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:11px;margin:18px 0 4px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:rgba(255,255,255,.17)}
#langBtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:white;padding:8px 12px;font-size:12px;min-height:36px;border-radius:11px}
.status{font-size:10px;padding:5px 9px;border-radius:20px;background:rgba(15,23,42,.65);color:#dbeafe;border:1px solid rgba(255,255,255,.16)}.statusrow{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.small{font-size:12px;margin-top:9px;color:#cbd5e1;line-height:1.6}#loginMsg{min-height:18px;line-height:1.6;overflow-wrap:anywhere;color:#cbd5e1}
.hidden{display:none!important}.warning{background:rgba(245,158,11,.14);color:#fde68a;border:1px solid rgba(251,191,36,.35);padding:12px;border-radius:12px;font-size:12px;margin:12px 0}
#appView{display:block}#appView>.card{display:flex;justify-content:space-between;align-items:center;gap:10px}#appView h3{font-size:17px;margin:26px 4px 12px;color:#e0e7ff}
#userEmail{overflow-wrap:anywhere;font-weight:700;margin-top:4px}.google-link{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#e0f2fe;margin-top:10px;font-size:11px;width:100%;padding:9px}
#logoutBtn,.dark{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:white}
.dept{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:18px;margin-top:12px;border:1px solid rgba(255,255,255,.23);border-radius:18px;color:#fff;background:linear-gradient(115deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 30px rgba(0,0,0,.16);min-height:76px}.dept .small{color:#cbd5e1}.dept b{font-size:22px;color:#a5f3fc}.repair{border-left:3px solid #60a5fa}.clean{border-left:3px solid #22d3ee}.weave{border-left:3px solid #a78bfa}
#deptView h2{margin-top:0}.dark{width:100%}footer{text-align:center;color:#94a3b8;font-size:11px;padding:18px 12px 28px}
@media(min-width:700px){main{margin-top:55px}#loginView{padding:38px}.card{border-radius:28px}}
@media(max-width:420px){header{padding:17px 15px 8px}main{width:calc(100% - 24px);margin-top:22px}.status{font-size:9px;padding:4px 7px}h1{font-size:17px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div><h1>SIGMA ColorCare</h1><p data-i18n="subtitle">智能工厂管理系统</p></div>
  <div style="text-align:right">
    <div class="statusrow"><span id="netStatus" class="status">检查网络</span><span id="fbStatus" class="status">连接中</span></div>
    <button id="langBtn" type="button" onclick="switchLang()">Tiếng Việt</button>
  </div>
</header>

<main>
  <section id="loginView" class="card">
    <h2 data-i18n="login">登录系统</h2>
    <div id="configWarning" class="warning hidden" data-i18n="configWarning">Firebase 尚未配置。</div>
    <form id="loginForm">
      <label for="email" data-i18n="email">账号 / 邮箱</label>
      <input type="email" id="email" placeholder="name@example.com" autocomplete="username" required>
      <label for="password" data-i18n="password">密码</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button id="loginBtn" class="primary" type="submit" data-i18n="loginBtn">登录</button>
    </form>
    <div class="divider" data-i18n="orContinue">或使用其他方式</div>
    <button id="googleLoginBtn" class="google-login" type="button"><span class="google-mark">G</span><span data-i18n="googleLogin">使用 Google 账号登录</span></button>
    <p id="loginMsg" class="small" role="status" aria-live="polite"></p>
  </section>

  <section id="appView" class="hidden">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="flex:1;min-width:0"><small data-i18n="user">当前用户</small><div id="userEmail"></div>
        <button id="googleLinkBtn" class="google-link" type="button" data-i18n="googleLink">绑定 Google 登录</button>
      </div>
      <button id="logoutBtn" type="button" onclick="logout()" data-i18n="logout">退出登录</button>
    </div>
    <h3 data-i18n="selectDept">请选择部门</h3>
    <button class="dept repair" type="button" onclick="openDept('repair')">
      <span><strong data-i18n="repair">修色部门 (1)</strong><div class="small" data-i18n="repairDesc">喷色 / 手工描绘</div></span><b>→</b>
    </button>
    <button class="dept clean" type="button" onclick="openDept('clean')">
      <span><strong data-i18n="clean">清洗部门 (2)</strong><div class="small" data-i18n="cleanDesc">清洗工序管理</div></span><b>→</b>
    </button>
    <button class="dept weave" type="button" onclick="openDept('weave')">
      <span><strong data-i18n="weave">修织部门 (3)</strong><div class="small" data-i18n="weaveDesc">修织工序管理</div></span><b>→</b>
    </button>
  </section>

  <section id="deptView" class="card hidden">
    <h2 id="deptTitle"></h2>
    <p data-i18n="placeholder">部门业务页面尚未开发，这是第一阶段框架。</p>
    <button class="dark" type="button" onclick="backHome()" data-i18n="back">返回首页</button>
  </section>
</main>

<footer>© 2026 SIGMA ColorCare · Firebase Spark</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signInWithRedirect, onAuthStateChanged, signOut,
  GoogleAuthProvider, linkWithRedirect, getRedirectResult
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyByXsPal78Fx7568VOlbGE3Q9SriQi1Utw",
  authDomain: "sigma-colorcare.firebaseapp.com",
  projectId: "sigma-colorcare",
  storageBucket: "sigma-colorcare.firebasestorage.app",
  messagingSenderId: "671273011048",
  appId: "1:671273011048:web:297aa24164afca48ceb8dd"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({prompt:"select_account"});

const translations = {
  zh: {
    subtitle:"智能工厂管理系统", login:"登录系统",
    configWarning:"Firebase 尚未配置。", email:"账号 / 邮箱", password:"密码",
    loginBtn:"邮箱密码登录", googleLogin:"使用 Google 账号登录", orContinue:"或使用其他方式", user:"当前用户", logout:"退出登录",
    selectDept:"请选择部门", repair:"修色部门 (1)", repairDesc:"喷色 / 手工描绘",
    clean:"清洗部门 (2)", cleanDesc:"清洗工序管理", weave:"修织部门 (3)",
    weaveDesc:"修织工序管理", placeholder:"部门业务页面尚未开发，这是第一阶段框架。",
    back:"返回首页", online:"在线", offline:"离线", configured:"Firebase 已连接",
    connecting:"Firebase 连接中", lang:"Tiếng Việt",
    signingIn:"正在验证账号……", checkingAdmin:"正在检查管理员权限……",
    loginFailed:"登录失败：", wrongPassword:"邮箱或密码不正确。",
    userNotFound:"没有找到该邮箱对应的账号。", invalidEmail:"邮箱格式不正确。",
    tooMany:"尝试次数过多，请稍后再试。", networkError:"网络连接失败，请检查网络后重试。",
    noAdmin:"账号已登录，但没有找到对应的管理员资料。请核对 Authentication UID 与 admins 文档 ID 是否完全一致。",
    inactive:"管理员账号尚未启用（status 必须为 active）。",
    notAdmin:"该账号没有管理员权限（role 必须为 admin）。",
    permission:"Firestore 权限不足。请检查 Firestore 安全规则是否允许已登录用户读取自己的 admins/{uid} 文档。",
    generic:"发生错误，请稍后重试。", signedOut:"已退出登录。",
    googleLink:"绑定 Google 登录", googleLinked:"Google 登录已绑定到当前账号", googleSigningIn:"正在跳转 Google 登录…", googleLoginSuccess:"Google 登录成功。",
    linkingGoogle:"正在跳转 Google 完成账号关联……", googleLinkSuccess:"Google 登录已成功关联，仍使用原管理员 UID。",
    googleLinkError:"Google 账号关联失败：", googleCredentialInUse:"这个 Google 账号已关联到其他 Firebase UID，不能直接合并。请先停止操作。",
    googleNeedPassword:"请先使用该管理员的邮箱和密码登录，再绑定 Google。"
  },
  vi: {
    subtitle:"Hệ thống quản lý nhà máy", login:"Đăng nhập hệ thống",
    configWarning:"Firebase chưa được cấu hình.", email:"Tài khoản / Email", password:"Mật khẩu",
    loginBtn:"Đăng nhập bằng Email", googleLogin:"Đăng nhập bằng Google", orContinue:"Hoặc tiếp tục bằng", user:"Người dùng hiện tại", logout:"Đăng xuất",
    selectDept:"Chọn bộ phận", repair:"Bộ phận Sửa màu (1)", repairDesc:"Phun màu / vẽ thủ công",
    clean:"Bộ phận Giặt (2)", cleanDesc:"Quản lý công đoạn giặt", weave:"Bộ phận Sửa dệt (3)",
    weaveDesc:"Quản lý sửa dệt", placeholder:"Module nghiệp vụ đang được phát triển.",
    back:"Quay lại trang chủ", online:"Trực tuyến", offline:"Ngoại tuyến", configured:"Firebase đã kết nối",
    connecting:"Đang kết nối Firebase", lang:"中文",
    signingIn:"Đang xác minh tài khoản…", checkingAdmin:"Đang kiểm tra quyền quản trị…",
    loginFailed:"Đăng nhập thất bại: ", wrongPassword:"Email hoặc mật khẩu không chính xác.",
    userNotFound:"Không tìm thấy tài khoản với email này.", invalidEmail:"Định dạng email không hợp lệ.",
    tooMany:"Thử quá nhiều lần, vui lòng thử lại sau.", networkError:"Lỗi mạng, vui lòng kiểm tra kết nối.",
    noAdmin:"Đã đăng nhập nhưng không tìm thấy hồ sơ quản trị tương ứng. Hãy kiểm tra UID Authentication và ID tài liệu admins có hoàn toàn trùng khớp không.",
    inactive:"Tài khoản quản trị chưa được kích hoạt (status phải là active).",
    notAdmin:"Tài khoản này không có quyền quản trị (role phải là admin).",
    permission:"Không đủ quyền Firestore. Hãy kiểm tra quy tắc bảo mật cho phép người dùng đã đăng nhập đọc tài liệu admins/{uid} của chính mình.",
    generic:"Đã xảy ra lỗi, vui lòng thử lại.", signedOut:"Đã đăng xuất.",
    googleLink:"Liên kết đăng nhập Google", googleLinked:"Google đã được liên kết với tài khoản này", googleSigningIn:"Đang chuyển đến Google để đăng nhập…", googleLoginSuccess:"Đăng nhập Google thành công.",
    linkingGoogle:"Đang chuyển đến Google để liên kết tài khoản…", googleLinkSuccess:"Đã liên kết Google thành công, vẫn sử dụng UID quản trị cũ.",
    googleLinkError:"Liên kết tài khoản Google thất bại: ", googleCredentialInUse:"Tài khoản Google này đã liên kết với một Firebase UID khác. Không thể tự động hợp nhất. Vui lòng dừng thao tác.",
    googleNeedPassword:"Vui lòng đăng nhập bằng email và mật khẩu của quản trị viên trước, sau đó mới liên kết Google."
  }
};

let lang = "zh";
let currentDept = "";
let handlingAuthState = false;

function tr(key){ return translations[lang][key] || key; }
function setMessage(message, isError=false){
  const el = document.getElementById("loginMsg");
  el.textContent = message;
  el.style.color = isError ? "#b91c1c" : "#166534";
}
function updateNet(){
  const el = document.getElementById("netStatus");
  el.textContent = navigator.onLine ? tr("online") : tr("offline");
  el.style.background = navigator.onLine ? "#166534" : "#92400e";
}
window.addEventListener("online", updateNet);
window.addEventListener("offline", updateNet);
updateNet();

document.getElementById("fbStatus").textContent = tr("configured");
document.getElementById("fbStatus").style.background = "#166534";

window.switchLang = function(){
  lang = lang === "zh" ? "vi" : "zh";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if(translations[lang][key]) el.textContent = translations[lang][key];
  });
  document.getElementById("langBtn").textContent = tr("lang");
  updateNet();
  if(currentDept) showDeptTitle();
};

function showLogin(){
  document.getElementById("loginView").classList.remove("hidden");
  document.getElementById("appView").classList.add("hidden");
  document.getElementById("deptView").classList.add("hidden");
}
function showApp(user){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("deptView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  document.getElementById("userEmail").textContent = user.email || user.uid;
  updateGoogleLinkButton(user);
  currentDept = "";
}
function updateGoogleLinkButton(user){
  const button = document.getElementById("googleLinkBtn");
  if(!button) return;
  const linked = !!user?.providerData?.some(item => item.providerId === "google.com");
  button.textContent = linked ? tr("googleLinked") : tr("googleLink");
  button.disabled = linked;
}
function mapAuthError(error){
  const code = error?.code || "";
  if(code.includes("credential-already-in-use") || code.includes("email-already-in-use")) return tr("googleCredentialInUse");
  if(code.includes("invalid-credential") || code.includes("wrong-password")) return tr("wrongPassword");
  if(code.includes("user-not-found")) return tr("userNotFound");
  if(code.includes("invalid-email")) return tr("invalidEmail");
  if(code.includes("too-many-requests")) return tr("tooMany");
  if(code.includes("network-request-failed")) return tr("networkError");
  if(code.includes("permission-denied")) return tr("permission");
  return tr("generic") + (code ? " (" + code + ")" : "");
}

async function verifyAdmin(user){
  const adminRef = doc(db, "admins", user.uid);
  const adminSnap = await getDoc(adminRef);
  if(!adminSnap.exists()) throw new Error("ADMIN_PROFILE_MISSING");
  const data = adminSnap.data();
  if(data.role !== "admin") throw new Error("ADMIN_ROLE_INVALID");
  if(data.status !== "active") throw new Error("ADMIN_INACTIVE");
  return true;
}


document.getElementById("googleLoginBtn").addEventListener("click", async () => {
  const button = document.getElementById("googleLoginBtn");
  button.disabled = true;
  setMessage(tr("googleSigningIn"));
  try{
    await signInWithRedirect(auth, googleProvider);
  }catch(error){
    console.error("SIGMA ColorCare Google sign-in error:", error);
    setMessage(tr("googleLinkError") + mapAuthError(error), true);
    button.disabled = false;
  }
});

document.getElementById("googleLinkBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if(!user){ setMessage(tr("googleNeedPassword"), true); return; }
  const hasPassword = user.providerData.some(item => item.providerId === "password");
  const alreadyLinked = user.providerData.some(item => item.providerId === "google.com");
  if(alreadyLinked){ updateGoogleLinkButton(user); setMessage(tr("googleLinked")); return; }
  if(!hasPassword){ setMessage(tr("googleNeedPassword"), true); return; }
  const button = document.getElementById("googleLinkBtn");
  button.disabled = true;
  setMessage(tr("linkingGoogle"));
  try{
    await linkWithRedirect(user, googleProvider);
  }catch(error){
    console.error("SIGMA ColorCare Google link error:", error);
    setMessage(tr("googleLinkError") + mapAuthError(error), true);
    button.disabled = false;
  }
});

getRedirectResult(auth).then(async result => {
  if(!result?.user) return;
  try{
    await verifyAdmin(result.user);
    showApp(result.user);
    setMessage(result.operationType === "signIn" ? tr("googleLoginSuccess") : tr("googleLinkSuccess"));
  }catch(error){
    console.error("SIGMA ColorCare post-link admin check error:", error);
    setMessage(tr("googleLinkError") + mapAuthError(error), true);
    try{ await signOut(auth); }catch(signOutError){ console.error(signOutError); }
    showLogin();
  }
}).catch(error => {
  console.error("SIGMA ColorCare Google redirect error:", error);
  setMessage(tr("googleLinkError") + mapAuthError(error), true);
  const googleButton = document.getElementById("googleLoginBtn");
  if(googleButton) googleButton.disabled = false;
});

document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const button = document.getElementById("loginBtn");
  button.disabled = true;
  setMessage(tr("signingIn"));
  try{
    const credential = await signInWithEmailAndPassword(auth, email, password);
    setMessage(tr("checkingAdmin"));
    await verifyAdmin(credential.user);
    showApp(credential.user);
    setMessage("");
  }catch(error){
    console.error("SIGMA ColorCare login error:", error);
    if(error.message === "ADMIN_PROFILE_MISSING"){
      setMessage(tr("noAdmin"), true);
    }else if(error.message === "ADMIN_ROLE_INVALID"){
      setMessage(tr("notAdmin"), true);
    }else if(error.message === "ADMIN_INACTIVE"){
      setMessage(tr("inactive"), true);
    }else{
      setMessage(tr("loginFailed") + mapAuthError(error), true);
    }
    if(auth.currentUser){
      try{ await signOut(auth); }catch(signOutError){ console.error(signOutError); }
    }
    showLogin();
  }finally{
    button.disabled = false;
  }
});

window.logout = async function(){
  try{
    await signOut(auth);
    currentDept = "";
    showLogin();
    setMessage(tr("signedOut"));
  }catch(error){
    console.error(error);
    setMessage(mapAuthError(error), true);
  }
};

window.openDept = function(key){
  currentDept = key;
  document.getElementById("appView").classList.add("hidden");
  document.getElementById("deptView").classList.remove("hidden");
  showDeptTitle();
};
function showDeptTitle(){
  const keys = {repair:"deptRepair", clean:"deptClean", weave:"deptWeave"};
  const labels = {
    zh:{deptRepair:"修色部门 (编码: 1)",deptClean:"清洗部门 (编码: 2)",deptWeave:"修织部门 (编码: 3)"},
    vi:{deptRepair:"Bộ phận Sửa màu (mã: 1)",deptClean:"Bộ phận Giặt (mã: 2)",deptWeave:"Bộ phận Sửa dệt (mã: 3)"}
  };
  document.getElementById("deptTitle").textContent = labels[lang][keys[currentDept]];
}
window.backHome = function(){
  document.getElementById("deptView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
};

onAuthStateChanged(auth, async user => {
  if(handlingAuthState) return;
  handlingAuthState = true;
  try{
    if(!user){
      showLogin();
      return;
    }
    await verifyAdmin(user);
    showApp(user);
  }catch(error){
    console.error("SIGMA ColorCare admin check error:", error);
    try{ await signOut(auth); }catch(signOutError){ console.error(signOutError); }
    showLogin();
    if(error.message === "ADMIN_PROFILE_MISSING") setMessage(tr("noAdmin"), true);
    else if(error.message === "ADMIN_ROLE_INVALID") setMessage(tr("notAdmin"), true);
    else if(error.message === "ADMIN_INACTIVE") setMessage(tr("inactive"), true);
    else setMessage(mapAuthError(error), true);
  }finally{
    handlingAuthState = false;
  }
});
</script>

<script>
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(err=>console.warn("SW registration failed",err)));
}
</script>
